<!DOCTYPE html>
<html>
<head>
    <title>Three.js Test</title>
</head>
<body>
    <div id="test-result">Loading Three.js...</div>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        const testDiv = document.getElementById('test-result');
        
        if (typeof THREE !== 'undefined') {
            testDiv.innerHTML = '✅ Three.js loaded successfully! Version: ' + THREE.REVISION;
            testDiv.style.color = 'green';
            
            // Create a simple test scene
            const scene = new THREE.Scene();
            const camera = new THREE.PerspectiveCamera(75, 1, 0.1, 1000);
            const renderer = new THREE.WebGLRenderer();
            
            testDiv.innerHTML += '<br/>✅ WebGL renderer created successfully!';
            
        } else {
            testDiv.innerHTML = '❌ Three.js failed to load';
            testDiv.style.color = 'red';
        }
    </script>
</body>
</html>
