version: '3.8'

services:
  # 3D Chess Server
  chess-server:
    build: .
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
    volumes:
      - .:/app
      - /app/node_modules
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/stats"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Web Dashboard (React app for monitoring)
  chess-dashboard:
    build:
      context: ./dashboard
    ports:
      - "8080:3000"
    environment:
      - REACT_APP_SERVER_URL=http://localhost:3000
    depends_on:
      - chess-server
    restart: unless-stopped

  # Redis for session storage (optional, for production)
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    command: redis-server --appendonly yes

volumes:
  redis_data: